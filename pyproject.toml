[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybernova-lab"
version = "1.0.0"
description = "A beginner-friendly cybersecurity learning toolkit for the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sansw123" }]
keywords = ["cybersecurity", "education", "cli", "python", "beginner"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
cybernova = "cybernova.cli:main"

[project.urls]
Homepage = "https://github.com/sansw123/cybernova-lab"
Issues = "https://github.com/sansw123/cybernova-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["cybernova"]
