name: Feature request
description: Suggest a safe, educational improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Small, well-explained learning features are welcome.
  - type: textarea
    id: idea
    attributes:
      label: What would you like to add?
      placeholder: I would like CyberNova to ...
    validations:
      required: true
  - type: textarea
    id: learning
    attributes:
      label: What would a beginner learn?
      placeholder: This teaches ... because ...
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Possible approach
      description: Include example commands or a small design if you have one.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: This is defensive, legal, and safe for a beginner lab.
          required: true
        - label: This does not require real credentials or unauthorised targets.
          required: true

